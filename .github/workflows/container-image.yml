name: Container image
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - .containerignore
      - .github/workflows/container-image.yml
      - Containerfile
      - SHA256SUMS
      - patches/**
      - scripts/build-q3.sh
      - scripts/container-entrypoint.sh
      - scripts/download-q3.sh
      - scripts/q3-env.sh
      - scripts/serve-q3.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        variant: [candidate, fast]
    # Images target one CPU and GPU, not the runner: an i5-14500 (Raptor Lake) and RTX 3060 (sm_86).
    env:
      CPU_ARCH: raptorlake
      CUDA_ARCHITECTURES: '86'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space for the CUDA builder image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-${{ matrix.variant }}-${{ env.CPU_ARCH }}-sm${{ env.CUDA_ARCHITECTURES }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            Q3_VARIANT=${{ matrix.variant }}
            CPU_ARCH=${{ env.CPU_ARCH }}
            CUDA_ARCHITECTURES=${{ env.CUDA_ARCHITECTURES }}
            BUILD_JOBS=4
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
